services:
  - type: web
    name: div-manager
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false   # Set manually in Render dashboard
      - key: SESSION_SECRET
        sync: false   # Set manually in Render dashboard — use a fixed value, don't rotate
